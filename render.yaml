# =============================================================================
#  Render Blueprint — one web service serving BOTH the API and the web app.
# =============================================================================
#  Render → New → Blueprint → pick this repository and the branch to deploy
#  (`staging` for the demo, `production` later). Render reads this file, creates
#  the service, and asks you for every value marked `sync: false`.
#
#  Why one service and not "static site + API": the refresh cookie must be
#  first-party. One origin means no proxy, no CORS, no cookie dropped on
#  reload. The full reasoning is in docs/08-DEPLOYMENT.md.
#
#  The database is NOT defined here: Render's free Postgres is deleted after 30
#  days. Use Neon (free, no expiry) and paste its connection string below.
# =============================================================================

services:
  - type: web
    name: lrc401
    runtime: node
    # Free sleeps after 15 min idle (first request then takes ~40 s).
    # `starter` ($7/month) stays awake — switch before real shifts rely on it.
    plan: free
    # Closest Render region to Lebanon.
    region: frankfurt
    branch: staging
    # --include=dev: Render sets NODE_ENV=production during the build too, and
    # without this npm skips Vite (client) and the Prisma CLI (server).
    buildCommand: >-
      npm ci --include=dev --prefix client &&
      npm run build --prefix client &&
      npm ci --include=dev --prefix server &&
      npm run db:generate --prefix server
    # `migrate deploy` only applies pending migrations and can never reset the
    # database. Running it at start is safe with a single instance.
    startCommand: npm run db:deploy --prefix server && npm start --prefix server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: 'true'
      - key: LOG_LEVEL
        value: info

      # --- You provide these ---------------------------------------------------
      # The public URL of THIS service, e.g. https://lrc401.onrender.com
      # (emails link to it and CORS allows it). Must be https.
      - key: CLIENT_URL
        sync: false
      # Neon → Connection details → the DIRECT (not pooled) string,
      # ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # 64 hex characters. Generate ONCE and keep a copy somewhere safe:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # Changing it later locks out everyone who has 2FA enabled.
      - key: TOTP_ENC_KEY
        sync: false

      # --- Generated by Render (random, different from each other) ------------
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_MFA_SECRET
        generateValue: true

      # --- Email ---------------------------------------------------------------
      - key: EMAIL_TRANSPORT
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
